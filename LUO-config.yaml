mixed-port: 7890
ipv6: true
udp: true
allow-lan: false
bind-address: '*'
mode: rule
log-level: info
unified-delay: true
experimental:
  ignore-resolve-fail: true
cfw-latency-timeout: 8000
cfw-latency-url: http://YouTube.com/generate_204
cfw-conn-break-strategy: true
hosts:
  mtalk.google.com: 108.177.125.188
  services.googleapis.cn: 74.125.203.94

dns:
  enable: true
  ipv6: true
  # DNS 引导解析
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  # Fake-IP
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  # 遵循代理规则
  respect-rules: true
  # 代理节点域名解析
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 国内 DNS
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  # 国外备用 DNS
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  # 备用 DNS 过滤
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - '+.google.com'
      - '+.facebook.com'
      - '+.youtube.com'
