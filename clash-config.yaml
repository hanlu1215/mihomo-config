
# ==========================================
# Mihomo DNS + Routing Rules
# SYSU 校园网 + 国内 IPv4/IPv6 直连 + 境外代理
# 自建 VPS：IPv4 出口
# 用于 3X-UI 远程规则导入
# ==========================================

# ==========================================
# IPv6
# ==========================================

# 启用 Mihomo IPv6 网络支持
ipv6: true


# ==========================================
# DNS Configuration
# ==========================================

dns:
  enable: true

  # 开启 AAAA 记录解析
  ipv6: true

  # Fake-IP 模式
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64

  cache-algorithm: arc

  # DNS 上游连接遵循路由规则
  respect-rules: true

  # ------------------------------------------
  # DNS 引导服务器
  # ------------------------------------------

  # 解析 DNS 服务端等必要域名
  default-nameserver:
    - 223.5.5.5

  # 代理节点域名解析
  # 避免代理节点解析依赖代理隧道
  proxy-server-nameserver:
    - 223.5.5.5

  # ------------------------------------------
  # 默认 DNS
  # ------------------------------------------

  # 未命中 nameserver-policy 的域名
  # 使用 Cloudflare DoH，经 PROXY 连接
  nameserver:
    - "https://cloudflare-dns.com/dns-query#PROXY"

  # ------------------------------------------
  # DNS 分流
  # ------------------------------------------

  nameserver-policy:

    # 中山大学校园域名
    "+.sysu.edu.cn":
      - system

    "+.sysu.org.cn":
      - system

    # 中国大陆域名
    "geosite:cn":
      - system

    # 私有域名
    "geosite:private":
      - system

    # 已识别的境外域名
    "geosite:geolocation-!cn":
      - "https://cloudflare-dns.com/dns-query#PROXY"

  # ------------------------------------------
  # DIRECT DNS
  # ------------------------------------------

  # 直连出站使用系统 DNS
  direct-nameserver:
    - system

  direct-nameserver-follow-policy: false

  # ------------------------------------------
  # Fake-IP Filter
  # ------------------------------------------

  fake-ip-filter:
    - "geosite:private"
    - "+.sysu.edu.cn"
    - "+.sysu.org.cn"
    - "+.lan"
    - "+.local"
    - "localhost"


# ==========================================
# Routing Rules
# ==========================================

rules:

  # ------------------------------------------
  # 1. SYSU 校园资源：本机直连
  # ------------------------------------------

  - DOMAIN-SUFFIX,sysu.edu.cn,DIRECT
  - DOMAIN-SUFFIX,sysu.org.cn,DIRECT

  # ------------------------------------------
  # 2. OpenAI / ChatGPT：代理
  # ------------------------------------------

  - GEOSITE,openai,PROXY
  - DOMAIN-SUFFIX,chatgpt.com,PROXY
  - DOMAIN-SUFFIX,chat.com,PROXY
  - DOMAIN-SUFFIX,openai.com,PROXY
  - DOMAIN-SUFFIX,oaistatic.com,PROXY
  - DOMAIN-SUFFIX,oaiusercontent.com,PROXY

  # ------------------------------------------
  # 3. Anthropic / Claude：代理
  # ------------------------------------------

  - GEOSITE,anthropic,PROXY
  - DOMAIN-SUFFIX,claude.ai,PROXY
  - DOMAIN-SUFFIX,claude.com,PROXY
  - DOMAIN-SUFFIX,anthropic.com,PROXY

  # ------------------------------------------
  # 4. 私有网络：直连
  # ------------------------------------------

  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT,no-resolve

  # ------------------------------------------
  # 5. 中国大陆域名：本机直连
  # ------------------------------------------

  - GEOSITE,cn,DIRECT

  # 中国大陆 IP：本机直连
  - GEOIP,CN,DIRECT,no-resolve

  # ------------------------------------------
  # 6. 其他所有流量：代理
  # ------------------------------------------

  - MATCH,PROXY
