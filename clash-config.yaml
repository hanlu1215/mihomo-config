
# ==========================================
# Mihomo DNS + Routing Rules
# 用于 3X-UI 远程规则导入
# ==========================================

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  cache-algorithm: arc

  # 默认引导 DNS：用于解析 DNS 服务器域名等
  default-nameserver:
    - 223.5.5.5

  # 专门用于解析代理节点域名，避免代理 DNS 自身形成循环
  proxy-server-nameserver:
    - 223.5.5.5

  # 默认 DNS：境外域名使用 Cloudflare DoH，通过 PROXY 连接
  nameserver:
    - "https://cloudflare-dns.com/dns-query#PROXY"

  # 国内域名和局域网域名使用 Android 系统当前配置的 DNS
  nameserver-policy:
    "geosite:cn":
      - system
    "geosite:private":
      - system
    "+.lan":
      - system
    "+.local":
      - system

  # DIRECT 出站重新解析域名时使用系统 DNS
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: true

  # 局域网域名不使用 Fake-IP
  fake-ip-filter:
    - "geosite:private"
    - "+.lan"
    - "+.local"
    - "localhost"

# ==========================================
# Routing Rules
# ==========================================

rules:
  # OpenAI / ChatGPT
  - GEOSITE,openai,PROXY
  - DOMAIN-SUFFIX,chatgpt.com,PROXY
  - DOMAIN-SUFFIX,chat.com,PROXY
  - DOMAIN-SUFFIX,openai.com,PROXY
  - DOMAIN-SUFFIX,oaistatic.com,PROXY
  - DOMAIN-SUFFIX,oaiusercontent.com,PROXY

  # Anthropic / Claude
  - GEOSITE,anthropic,PROXY
  - DOMAIN-SUFFIX,claude.ai,PROXY
  - DOMAIN-SUFFIX,claude.com,PROXY
  - DOMAIN-SUFFIX,anthropic.com,PROXY

  # Private / LAN
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT

  # Mainland China
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # Other traffic
  - MATCH,PROXY
