# ==========================================
# Mihomo DNS + Routing Rules
# SYSU 校园网 + 国内直连 + 境外代理
# 用于 3X-UI 远程规则导入
# ==========================================

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  cache-algorithm: arc

  # DNS 引导服务器
  # 用于解析 Cloudflare DoH 和代理节点等域名
  default-nameserver:
    - 223.5.5.5

  # 代理节点域名解析
  proxy-server-nameserver:
    - 223.5.5.5

  # 默认 DNS：使用 Android 当前系统 DNS
  nameserver:
    - system

  # 根据域名分类选择 DNS
  nameserver-policy:

    # 国内域名：系统默认 DNS
    "geosite:cn":
      - system

    # 私有域名：系统默认 DNS
    "geosite:private":
      - system

    # 中山大学校园域名：系统默认 DNS
    "+.sysu.edu.cn":
      - system
    "+.sysu.org.cn":
      - system

    # 已识别的境外域名：Cloudflare DoH，通过代理连接
    "geosite:geolocation-!cn":
      - "https://cloudflare-dns.com/dns-query#PROXY"

  # DIRECT 出站的域名解析使用系统 DNS
  direct-nameserver:
    - system
  direct-nameserver-follow-policy: false

  # 局域网和校园域名不使用 Fake-IP
  fake-ip-filter:
    - "geosite:private"
    - "+.sysu.edu.cn"
    - "+.sysu.org.cn"
    - "+.lan"
    - "+.local"
    - "localhost"

# ==========================================
# Routing Rules
# ==========================================

rules:
  # 中山大学校园资源：优先直连
  - DOMAIN-SUFFIX,sysu.edu.cn,DIRECT
  - DOMAIN-SUFFIX,sysu.org.cn,DIRECT

  # OpenAI / ChatGPT
  - GEOSITE,openai,PROXY
  - DOMAIN-SUFFIX,chatgpt.com,PROXY
  - DOMAIN-SUFFIX,chat.com,PROXY
  - DOMAIN-SUFFIX,openai.com,PROXY
  - DOMAIN-SUFFIX,oaistatic.com,PROXY
  - DOMAIN-SUFFIX,oaiusercontent.com,PROXY

  # Anthropic / Claude
  - GEOSITE,anthropic,PROXY
  - DOMAIN-SUFFIX,claude.ai,PROXY
  - DOMAIN-SUFFIX,claude.com,PROXY
  - DOMAIN-SUFFIX,anthropic.com,PROXY

  # Private / LAN
  - GEOSITE,private,DIRECT
  - GEOIP,private,DIRECT

  # Mainland China
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT

  # Other traffic
  - MATCH,PROXY
